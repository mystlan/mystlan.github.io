<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>深圳图书馆 · 座位巡查</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f0f2f5;padding:12px}.app{max-width:1400px;margin:auto}.head{background:linear-gradient(135deg,#1a2a6c,#2d4373);color:#fff;padding:18px;border-radius:18px;margin-bottom:20px}.head h1{margin:0;font-size:22px}.search{max-width:600px;margin:0 auto 20px;background:#fff;padding:15px;border-radius:16px;display:flex;gap:8px}.search input{flex:1;min-width:0;padding:11px;border:1px solid #ddd;border-radius:12px}.search button,.back{border:0;background:#1a2a6c;color:#fff;padding:10px 14px;border-radius:12px}.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.home button,.login{background:#fff;border:0;border-radius:16px;padding:22px 10px;box-shadow:0 3px 12px #0001;text-align:center;text-decoration:none;color:#1a2a6c;font-weight:700;font-size:16px}.login{background:#1a2a6c;color:#fff}.zone{background:#fff;border-radius:16px;margin:0 0 20px;overflow:hidden}.zh{padding:12px 16px;font-weight:700;border-bottom:1px solid #eee}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;padding:14px}.seat{color:#fff;text-decoration:none;text-align:center;padding:14px 2px;border-radius:9px;font-weight:700}.seat.last{outline:3px solid #111;outline-offset:2px;position:relative}.seat.last:after{content:'上次';position:absolute;top:-8px;right:-4px;background:#111;color:#fff;font-size:9px;padding:3px 5px;border-radius:8px}@media(max-width:480px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:10px 8px}.seat{font-size:11px;padding:10px 1px}.home{grid-template-columns:repeat(2,1fr)}.head h1{font-size:18px}.search{flex-direction:column}}</style></head><body><div class="app"><div class="head"><h1 id="title">📍 深圳图书馆 · 座位巡查</h1><div id="action" style="margin-top:10px"></div></div><main id="main"></main></div><script>function pts(p,e,a){let r=[];for(let i=1;i<=e;i++){let n=String(i).padStart(3,'0'),t=p+n;r.push({n:t,u:'https://ulas1.szlib.org.cn/seatman4mobile/PatrolScan?scene=SeatPatrol&area='+a+'&point='+t})}return r}const F={1:[['A','#e74c3c',pts('A',140,'STC1FA')],['B','#2980b9',pts('B',100,'STC1FB')],['C','#27ae60',pts('C',80,'STC1FC')],['D','#f39c12',pts('D',96,'STC1FD')]],2:[['A','#e74c3c',pts('A',86,'STC2FA')],['B','#2980b9',pts('B',36,'STC2FB')],['C','#27ae60',pts('C',38,'STC2FC')],['D','#f39c12',pts('D',62,'STC2FD')],['E','#8e44ad',pts('E',18,'STC2FE')]],3:[['D','#f39c12',pts('D',46,'STC3FD')],['A','#e74c3c',pts('A',130,'STC3FA')],['B','#2980b9',pts('B',44,'STC3FB')],['C','#27ae60',pts('C',132,'STC3FC')]],4:[['A','#e74c3c',pts('4',60,'STC4FA')]],5:[['A','#e74c3c',pts('A',16,'STC5FA')],['B','#2980b9',pts('B',36,'STC5FB')],['C','#27ae60',pts('C',24,'STC5FC')]],6:[['A','#e74c3c',pts('A',12,'STC6FA')],['B','#2980b9',pts('B',56,'STC6FB')]]};const main=document.getElementById('main'),title=document.getElementById('title'),action=document.getElementById('action');function home(){title.textContent='📍 深圳图书馆 · 座位巡查';action.innerHTML='';main.innerHTML='<div class="search"><input id="q" placeholder="输入书名检索..."><button id="s">中心馆文献检索</button></div><div class="home"><a class="login" href="https://ulas1.szlib.org.cn/seatman4mobile/index">🔑 登录</a>'+[1,2,3,4,5,6].map(i=>'<button onclick="floor('+i+')">'+i+'楼巡座</button>').join('')+'</div>';document.getElementById('s').onclick=()=>{let v=document.getElementById('q').value.trim();if(!v)return alert('请先输入书名');location.href='https://www.szlib.org.cn/opac/searchShow?v_index=title&sortfield=ptitle&sorttype=desc&pageNum=10&library=all&v_tablearray=bibliosm,serbibm,apabibibm,mmbibm,&addr=044005&v_value='+encodeURIComponent(v)}}function floor(n){title.textContent='📍 '+n+'楼巡座';action.innerHTML='<button class="back" onclick="home()">🏠 返回首页</button>';main.innerHTML=F[n].map(z=>'<section class="zone"><div class="zh">'+z[0]+' 区 · '+z[2].length+' 个点位</div><div class="grid">'+z[2].map(p=>'<a class="seat" data-p="'+p.n+'" href="'+p.u+'" style="background:'+z[1]+'">'+p.n+'</a>').join('')+'</div></section>').join('');document.querySelectorAll('.seat').forEach(e=>e.onclick=()=>{sessionStorage.setItem('floor',n);sessionStorage.setItem('point',e.dataset.p)});restore(n)}function restore(n){let f=sessionStorage.getItem('floor'),p=sessionStorage.getItem('point');if(String(n)==f&&p){let e=[...document.querySelectorAll('.seat')].find(x=>x.dataset.p==p);if(e){e.classList.add('last');setTimeout(()=>e.scrollIntoView({block:'center'}),0);return}}scrollTo(0,0)}addEventListener('pageshow',()=>{let f=sessionStorage.getItem('floor'),p=sessionStorage.getItem('point');if(f&&p&&document.querySelector('.seat'))restore(f)});home()</script></body></html>
