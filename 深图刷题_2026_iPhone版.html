<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6fa">
<title>深图刷题 · 2026</title>
<style>
:root {
  --bg:#f5f6fa; --card:#fff; --text:#17181c; --sub:#6d7280; --line:#e7e9ef;
  --primary:#315efb; --primarySoft:#eef2ff; --good:#15803d; --goodBg:#ecfdf3;
  --bad:#c62828; --badBg:#fff0f0; --warn:#9a6700; --warnBg:#fff7db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.92);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(0,0,0,.04)}
.toprow{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:18px} .muted{color:var(--sub);font-size:13px}
.wrap{max-width:760px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#315efb,#6678ff);color:white;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(49,94,251,.18)}
.hero h1{margin:0 0 8px;font-size:24px} .hero p{margin:0;opacity:.88;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.14);padding:10px;border-radius:14px;text-align:center} .stat b{display:block;font-size:20px}
.sectionTitle{font-size:16px;font-weight:800;margin:20px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;text-align:left;min-height:112px;box-shadow:0 2px 8px rgba(0,0,0,.025)}
.mode:active{transform:scale(.985)} .mode .icon{font-size:24px} .mode b{display:block;margin:8px 0 4px;font-size:16px} .mode span{color:var(--sub);font-size:12px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.03)}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--sub);font-size:13px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--primarySoft);color:var(--primary);font-weight:700;font-size:12px}
.question{font-size:19px;font-weight:750;line-height:1.55;margin:0 0 16px}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid var(--line);background:white;border-radius:16px;padding:14px;margin:10px 0;text-align:left;line-height:1.5}
.option .key{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #cfd3dc;flex:0 0 auto;font-weight:700}
.option.selected{border-color:var(--primary);background:var(--primarySoft)} .option.selected .key{background:var(--primary);border-color:var(--primary);color:white}
.option.correct{border-color:#55a66e;background:var(--goodBg)} .option.correct .key{background:var(--good);border-color:var(--good);color:white}
.option.wrong{border-color:#e78b8b;background:var(--badBg)} .option.wrong .key{background:var(--bad);border-color:var(--bad);color:white}
.feedback{margin-top:14px;padding:13px 14px;border-radius:14px;line-height:1.5;font-size:14px} .feedback.good{background:var(--goodBg);color:var(--good)} .feedback.bad{background:var(--badBg);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px} .btn{border:none;border-radius:14px;padding:13px 16px;font-weight:750;flex:1;background:#e9ebf1;color:#282b33}
.btn.primary{background:var(--primary);color:white} .btn.ghost{background:white;border:1px solid var(--line)} .btn:disabled{opacity:.45}
.progress{height:6px;background:#e8eaf0;border-radius:999px;overflow:hidden;margin-top:10px} .bar{height:100%;background:var(--primary);width:0;transition:.25s}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line)}
.bottomin{max-width:760px;margin:auto;display:flex;gap:10px}
.smallbtn{border:1px solid var(--line);background:white;border-radius:13px;padding:11px 13px;font-weight:700} .grow{flex:1}
.hidden{display:none!important}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.38);display:flex;align-items:flex-end} .sheetbox{background:white;width:100%;max-height:80vh;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));overflow:auto}
.sheetinner{max-width:760px;margin:auto} .numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.num{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:white;font-weight:700} .num.done{background:var(--primarySoft);color:var(--primary);border-color:#bdc9ff} .num.current{background:var(--primary);color:white}
.result{text-align:center;padding:18px 0} .score{font-size:54px;font-weight:900;letter-spacing:-2px} .score small{font-size:18px;color:var(--sub);font-weight:600}
.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0} .resultcell{background:#f7f8fb;border-radius:14px;padding:12px 6px} .resultcell b{display:block;font-size:20px}
.settingrow{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);gap:15px}
.switch{width:48px;height:28px;border-radius:999px;background:#cfd3dc;padding:3px;transition:.2s;flex:0 0 auto} .switch i{display:block;width:22px;height:22px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 4px #9995} .switch.on{background:var(--primary)} .switch.on i{transform:translateX(20px)}
.notice{background:var(--warnBg);color:var(--warn);padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;margin-top:12px}
@media (min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="top"><div class="toprow">
  <div><div class="brand">深图刷题 · 2026</div><div class="muted" id="topSub">题库练习</div></div>
  <button class="smallbtn" id="homeBtn" onclick="goHome()">首页</button>
</div><div class="progress"><div class="bar" id="bar"></div></div></div>

<main class="wrap">
<section id="home">
  <div class="hero">
    <h1>今天刷几题？</h1>
    <p>基于《刷题（2026.7.31）》整理。答题记录、错题和收藏保存在本机浏览器。</p>
    <div class="stats">
      <div class="stat"><b id="totalQ">0</b><span>可用题目</span></div>
      <div class="stat"><b id="wrongN">0</b><span>错题</span></div>
      <div class="stat"><b id="favN">0</b><span>收藏</span></div>
    </div>
  </div>

  <div class="sectionTitle">模拟考试</div>
  <button class="mode" style="width:100%;min-height:125px" onclick="startExam()">
    <div class="icon">📝</div><b>25 题模拟考</b>
    <span>10 道单选 × 0.5 分 + 15 道多选 × 1 分，满分 20 分；全部做完后统一交卷判分。</span>
  </button>

  <div class="sectionTitle">刷题练习</div>
  <div class="grid">
    <button class="mode" onclick="startPractice('sequence')"><div class="icon">📚</div><b>顺序练习</b><span>按题库顺序一直刷</span></button>
    <button class="mode" onclick="startPractice('random')"><div class="icon">🔀</div><b>随机练习</b><span>随机抽 30 题</span></button>
    <button class="mode" onclick="startPractice('single')"><div class="icon">1️⃣</div><b>只刷单选</b><span>集中练单选题</span></button>
    <button class="mode" onclick="startPractice('multi')"><div class="icon">☑️</div><b>只刷多选</b><span>集中练多选题</span></button>
    <button class="mode" onclick="startPractice('wrong')"><div class="icon">❌</div><b>错题重练</b><span>只练以前做错的题</span></button>
    <button class="mode" onclick="startPractice('fav')"><div class="icon">⭐️</div><b>收藏题</b><span>反复复习重点题</span></button>
  </div>

  <div class="sectionTitle">练习设置</div>
  <div class="card">
    <div class="settingrow"><div><b>答完立即判题</b><div class="muted">练习模式选择后立即显示对错与答案</div></div><div class="switch on" id="instantSwitch" onclick="toggleInstant()"><i></i></div></div>
    <div class="settingrow"><div><b>选项随机排序</b><div class="muted">每道题打乱 A-E 显示顺序，不改变正确答案</div></div><div class="switch" id="shuffleSwitch" onclick="toggleShuffle()"><i></i></div></div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="qmeta">
      <div><span class="tag" id="typeTag">单选题</span> <span id="qIndex"></span></div>
      <button class="smallbtn" id="favBtn" onclick="toggleFav()">☆ 收藏</button>
    </div>
    <h2 class="question" id="qText"></h2>
    <div id="options"></div>
    <div id="feedback"></div>
    <div class="actions" id="practiceActions">
      <button class="btn ghost" onclick="prevQ()">上一题</button>
      <button class="btn primary" id="checkBtn" onclick="checkPractice()">确认答案</button>
      <button class="btn" onclick="nextQ()">下一题</button>
    </div>
  </div>
  <div class="notice" id="examNotice" style="display:none">模拟考期间不会提前显示正确答案；多选题必须全部选对且不多选才得分。</div>
</section>

<section id="result" class="hidden">
  <div class="card result">
    <div class="muted">本次模拟考成绩</div>
    <div class="score"><span id="scoreVal">0</span><small> / 20</small></div>
    <div class="resultgrid">
      <div class="resultcell"><b id="correctVal">0</b><span class="muted">答对</span></div>
      <div class="resultcell"><b id="wrongVal">0</b><span class="muted">答错</span></div>
      <div class="resultcell"><b id="blankVal">0</b><span class="muted">未答</span></div>
    </div>
    <button class="btn primary" onclick="reviewExam()">查看本次错题</button>
    <button class="btn ghost" style="margin-top:10px;width:100%" onclick="startExam()">再考一套</button>
  </div>
</section>
</main>

<div class="bottom hidden" id="bottom">
  <div class="bottomin">
    <button class="smallbtn" onclick="openSheet()">题号</button>
    <button class="smallbtn grow" id="submitBtn" onclick="submitExam()">交卷</button>
  </div>
</div>

<div class="sheet hidden" id="sheet" onclick="closeSheet(event)">
  <div class="sheetbox"><div class="sheetinner">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b>题号导航</b><button class="smallbtn" onclick="forceCloseSheet()">完成</button></div>
    <div class="numgrid" id="numgrid"></div>
  </div></div>
</div>

<script>

 "question": "关于图书转借规则，以下说法正确的是（）（多选）", "options": [{"key": "A", "text": "“转出”视同还书"}, {"key": "B", "text": "“转入”视同借书"}, {"key": "C", "text": "登录移动服务平台可办理图书转借手续"}, {"key": "D", "text": "不限制同一读者证对同一文献的转借次数"}], "answer": ["A", "B", "C"], "type": "multi"}, {"id": 233, "question": "遗失文献后，以下行为正确的是（BC）", "options": [{"key": "A", "text": "遗失文献，读者不需进行赔偿"}, {"key": "B", "text": "遗失普通文献按原价3-10倍赔偿，遗失整套文献的任一分册按遗失文献原价的5-10倍赔偿"}, {"key": "C", "text": "读者自购相同版本的文献归还图书馆，并缴纳文献加工费10元/册"}, {"key": "D", "text": "遗失文献按任意价格赔偿 23.读者新办读者证可通过以下哪些途径办理："}], "answer": ["A", "B", "C"], "type": "multi"}, {"id": 234, "question": "关于图书预借以下说法正确的是:", "options": [{"key": "A", "text": "预借自取(送达自助图书馆)：读者收到预借取书通知后，务必在2天内(发短信当天不算)到自助图书馆办理取书手续"}, {"key": "B", "text": "读者超过2天（收到信息当天不算）取书，会产生违约记录"}, {"key": "C", "text": "预借书违约超时取或者不取超过7册，即会暂停预借功能半年"}, {"key": "D", "text": "图书会一直保留在自助图书馆，直到读者取走"}], "answer": ["A", "B", "C"], "type": "multi"}, {"id": 235, "question": "凭本人读者证和有效证件返还押金和预付款，无须满足以下哪些条件?", "options": [{"key": "A", "text": "关注深圳图书馆公众号"}, {"key": "B", "text": "持有读者证实体卡"}, {"key": "C", "text": "需还清所借文献"}, {"key": "D", "text": "结清逾期滞还费"}, {"key": "E", "text": "有借还记录"}], "answer": ["A", "B", "C", "E"], "type": "multi"}, {"id": 236, "question": "几楼提供充电宝借用服务?费用为多少元/半小时?", "options": [{"key": "A", "text": "一楼志愿者服务站"}, {"key": "B", "text": "二楼总台"}, {"key": "C", "text": "三楼服务台"}, {"key": "D", "text": "0.5"}, {"key": "E", "text": "1"}], "answer": ["A", "B", "C", "D"], "type": "multi"}, {"id": 237, "question": "以下哪些情形无法进行续借操作?", "options": [{"key": "A", "text": "所借图书已续借3次"}, {"key": "B", "text": "借阅的中外文图书未到期"}, {"key": "C", "text": "借阅的文献类型为期刊"}, {"key": "D", "text": "未结清逾期滞还费用"}, {"key": "E", "text": "有逾期未还文献"}], "answer": ["A", "C", "D", "E"], "type": "multi"}];
let state = {
  mode:'home', list:[], idx:0, selected:{}, checked:{}, exam:false,
  instant: JSON.parse(localStorage.getItem('instant') ?? 'true'),
  shuffle: JSON.parse(localStorage.getItem('shuffle') ?? 'false'),
  wrong: JSON.parse(localStorage.getItem('wrongIds') ?? '[]'),
  fav: JSON.parse(localStorage.getItem('favIds') ?? '[]'),
  examResult:null, reviewOnly:false
};

const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function sameSet(a,b){return a.length===b.length && [...a].sort().every((x,i)=>x===[...b].sort()[i])}
function save(){localStorage.setItem('wrongIds',JSON.stringify(state.wrong));localStorage.setItem('favIds',JSON.stringify(state.fav));}
function updateHome(){
  $('totalQ').textContent=QUESTIONS.length;$('wrongN').textContent=state.wrong.length;$('favN').textContent=state.fav.length;
  $('instantSwitch').classList.toggle('on',state.instant);$('shuffleSwitch').classList.toggle('on',state.shuffle);
}
function toggleInstant(){state.instant=!state.instant;localStorage.setItem('instant',JSON.stringify(state.instant));updateHome()}
function toggleShuffle(){state.shuffle=!state.shuffle;localStorage.setItem('shuffle',JSON.stringify(state.shuffle));updateHome()}
function goHome(){state.mode='home';state.exam=false;state.reviewOnly=false;$('home').classList.remove('hidden');$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('bottom').classList.add('hidden');$('bar').style.width='0';$('topSub').textContent='题库练习';updateHome()}
function startPractice(mode){
  let list=[];
  if(mode==='sequence') list=[...QUESTIONS];
  if(mode==='random') list=shuffle(QUESTIONS).slice(0,Math.min(30,QUESTIONS.length));
  if(mode==='single') list=QUESTIONS.filter(q=>q.type==='single');
  if(mode==='multi') list=QUESTIONS.filter(q=>q.type==='multi');
  if(mode==='wrong') list=QUESTIONS.filter(q=>state.wrong.includes(q.id));
  if(mode==='fav') list=QUESTIONS.filter(q=>state.fav.includes(q.id));
  if(!list.length){alert(mode==='wrong'?'目前还没有错题。':'目前还没有收藏题。');return}
  state.mode=mode;state.list=list;state.idx=0;state.selected={};state.checked={};state.exam=false;state.reviewOnly=false;
  showQuiz();
}
function startExam(){
  let singles=shuffle(QUESTIONS.filter(q=>q.type==='single')).slice(0,10);
  let multis=shuffle(QUESTIONS.filter(q=>q.type==='multi')).slice(0,15);
  if(singles.length<10||multis.length<15){alert('题库数量不足以组成模拟卷');return}
  state.mode='exam';state.list=[...singles,...multis];state.idx=0;state.selected={};state.checked={};state.exam=true;state.reviewOnly=false;state.examResult=null;
  showQuiz();
}
function showQuiz(){
  $('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
  $('bottom').classList.toggle('hidden',!state.exam);$('examNotice').style.display=state.exam?'block':'none';
  $('practiceActions').style.display=state.exam?'none':'flex';
  $('topSub').textContent=state.exam?'模拟考试 · 满分 20 分':'练习模式';
  renderQ();
}
function current(){return state.list[state.idx]}
function getOpts(q){
  if(!state.shuffle) return q.options;
  if(!q._shuffled) q._shuffled=shuffle(q.options);
  return q._shuffled;
}
function renderQ(){
  let q=current(); if(!q)return;
  $('qIndex').textContent=`${state.idx+1} / ${state.list.length}`;
  $('typeTag').textContent=q.type==='single'?'单选题':'多选题';
  $('qText').textContent=q.question;
  $('favBtn').textContent=state.fav.includes(q.id)?'★ 已收藏':'☆ 收藏';
  let sel=state.selected[q.id]||[];
  let checked=!!state.checked[q.id];
  let reveal=checked && !state.exam;
  $('options').innerHTML='';
  getOpts(q).forEach(o=>{
    let b=document.createElement('button');b.className='option';
    if(sel.includes(o.key)) b.classList.add('selected');
    if(reveal && q.answer.includes(o.key)) b.classList.add('correct');
    if(reveal && sel.includes(o.key) && !q.answer.includes(o.key)) b.classList.add('wrong');
    b.innerHTML=`<span class="key">${o.key}</span><span>${escapeHtml(o.text)}</span>`;
    b.onclick=()=>choose(o.key);$('options').appendChild(b);
  });
  $('feedback').innerHTML='';
  if(reveal){
    let ok=sameSet(sel,q.answer);
    $('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'回答正确':'回答错误'}。正确答案：<b>${q.answer.join('、')}</b></div>`;
  }
  $('checkBtn').style.display=state.instant?'none':'block';
  $('bar').style.width=`${((state.idx+1)/state.list.length)*100}%`;
  if(state.exam) renderNumGrid();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function choose(key){
  if(state.reviewOnly) return;
  let q=current(), arr=[...(state.selected[q.id]||[])];
  if(q.type==='single') arr=[key]; else arr=arr.includes(key)?arr.filter(x=>x!==key):[...arr,key];
  state.selected[q.id]=arr;
  if(!state.exam && state.instant){
    state.checked[q.id]=true;
    judgePractice(q);
  }
  renderQ();
}
function judgePractice(q){
  let ok=sameSet(state.selected[q.id]||[],q.answer);
  if(ok) state.wrong=state.wrong.filter(id=>id!==q.id);
  else if(!state.wrong.includes(q.id)) state.wrong.push(q.id);
  save();
}
function checkPractice(){
  let q=current(); if(!(state.selected[q.id]||[]).length){alert('请先选择答案');return}
  state.checked[q.id]=true;judgePractice(q);renderQ();
}
function prevQ(){if(state.idx>0){state.idx--;renderQ()}}
function nextQ(){
  let q=current();
  if(!state.exam && !state.instant && (state.selected[q.id]||[]).length && !state.checked[q.id]){state.checked[q.id]=true;judgePractice(q)}
  if(state.idx<state.list.length-1){state.idx++;renderQ()} else if(!state.exam) alert('已经到最后一题啦');
}
function toggleFav(){
  let id=current().id;state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];save();renderQ();
}
function renderNumGrid(){
  $('numgrid').innerHTML='';
  state.list.forEach((q,i)=>{let b=document.createElement('button');b.className='num';b.textContent=i+1;
    if((state.selected[q.id]||[]).length)b.classList.add('done');if(i===state.idx)b.classList.add('current');
    b.onclick=()=>{state.idx=i;forceCloseSheet();renderQ()};$('numgrid').appendChild(b);
  });
}
function openSheet(){$('sheet').classList.remove('hidden');renderNumGrid()}
function forceCloseSheet(){$('sheet').classList.add('hidden')}
function closeSheet(e){if(e.target.id==='sheet')forceCloseSheet()}
function submitExam(){
  if(!state.exam)return;
  let blank=state.list.filter(q=>!(state.selected[q.id]||[]).length).length;
  if(blank && !confirm(`还有 ${blank} 题未作答，确定交卷吗？`))return;
  let score=0,correct=0,wrong=0;
  state.list.forEach(q=>{
    let sel=state.selected[q.id]||[],ok=sameSet(sel,q.answer);
    if(ok){correct++;score+=q.type==='single'?0.5:1;state.wrong=state.wrong.filter(id=>id!==q.id)}
    else{if(sel.length)wrong++;if(!state.wrong.includes(q.id))state.wrong.push(q.id)}
  });
  save();
  state.examResult={score,correct,wrong,blank};
  $('quiz').classList.add('hidden');$('bottom').classList.add('hidden');$('result').classList.remove('hidden');
  $('scoreVal').textContent=Number.isInteger(score)?score:score.toFixed(1);$('correctVal').textContent=correct;$('wrongVal').textContent=wrong;$('blankVal').textContent=blank;
  $('topSub').textContent='模拟考试 · 已交卷';$('bar').style.width='100%';
}
function reviewExam(){
  if(!state.examResult)return;
  let wrongQs=state.list.filter(q=>!sameSet(state.selected[q.id]||[],q.answer));
  if(!wrongQs.length){alert('全对！本次没有错题。');return}
  state.list=wrongQs;state.idx=0;state.exam=false;state.reviewOnly=true;
  wrongQs.forEach(q=>state.checked[q.id]=true);
  $('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('practiceActions').style.display='flex';$('examNotice').style.display='none';
  $('checkBtn').style.display='none';$('topSub').textContent='本次错题回顾';renderQ();
}
updateHome();goHome();
</script>
